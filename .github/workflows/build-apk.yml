name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version 2>&1
          VERSION_RAW="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi
          MAJOR_VERSION="$(echo "$VERSION_RAW" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$VERSION_RAW'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi
          if [ -z "$KEYTOOL_BIN" ]; then
            echo "::error::keytool could not be found in the configured Java 17 installation."
            exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary ./debug.keystore."
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore does not exist after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp "$APK_PATH" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare verified .apk release asset."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}

          **Notice:** This APK is intended for testing only. It is **not** a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "## Debug APK Build & Release Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo ""
              echo "The APK can be downloaded directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload succeeded."
            echo "APK build succeeded. The GitHub Actions artifact named 'app-debug-apk' remains available for download."

            {
              echo "## Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed, but the APK build and artifact upload succeeded."
              echo ""
              echo "- **Backup Artifact:** Download \`app-debug-apk\` from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The debug APK build or artifact upload did not complete successfully."
            {
              echo "## Debug APK Build Failed"
              echo ""
              echo "The debug APK build or artifact upload failed before release publishing could complete."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
